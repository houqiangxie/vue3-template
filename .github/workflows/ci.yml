name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pin until ubuntu-latest → 26 migration settles (after 2026-10-19)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 仓库内仍有历史 TS 债务（BPMN 上游等）；先保证可构建与 lint，typecheck 不阻断合并
      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          VITE_USE_MOCK: 'false'
