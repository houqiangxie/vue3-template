server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 基础安全头（CSP 保持相对宽松，避免 Naive UI / 内联样式被拦）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Web 管理端（主入口）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # App 端 MPA
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # BPM 流程设计独立站
    location /bpm/ {
        try_files $uri $uri/ /bpm/index.html;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|br|gz)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # API 由独立网关或 docker-compose api-proxy 服务转发
    location /api/ {
        return 502 '{"code":502,"message":"API gateway not configured"}';
        add_header Content-Type application/json;
    }
}
